name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: runidbg-macos-arm64
            archive: tar.gz
            bin_ext: ""
            sign_hypervisor: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: runidbg-linux-x86_64
            archive: tar.gz
            bin_ext: ""
            sign_hypervisor: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: runidbg-linux-arm64
            archive: tar.gz
            bin_ext: ""
            sign_hypervisor: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: runidbg-windows-x86_64
            archive: zip
            bin_ext: ".exe"
            sign_hypervisor: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config cmake ninja-build clang libclang-dev

      - name: Install native build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pkgconf cmake ninja

      - name: Install native build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja --no-progress -y

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact_name }}

      - name: Build release binary (Unix)
        if: runner.os != 'Windows'
        run: cargo build --release --target ${{ matrix.target }} --bin runidbg-cli

      - name: Sign macOS binary with Hypervisor.framework entitlement
        if: matrix.sign_hypervisor
        run: |
          codesign --force --sign - \
            --entitlements entitlements/hypervisor.plist \
            "target/${{ matrix.target }}/release/runidbg-cli"
          codesign --display --entitlements - "target/${{ matrix.target }}/release/runidbg-cli"

      - name: Build release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo build --release --target ${{ matrix.target }} --bin runidbg-cli

      - name: Package artifact (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          STAGE="${{ matrix.artifact_name }}-${VERSION}"
          mkdir -p "${STAGE}" dist
          cp "target/${{ matrix.target }}/release/runidbg-cli${{ matrix.bin_ext }}" "${STAGE}/"
          cp LICENSE README.md README_EN.md "${STAGE}/"
          if [ "${{ matrix.sign_hypervisor }}" = "true" ]; then
            cp entitlements/hypervisor.plist "${STAGE}/"
          fi
          tar -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256")
          fi

      - name: Package artifact (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME
          $stage = "${{ matrix.artifact_name }}-$version"
          New-Item -ItemType Directory -Force -Path $stage, dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\runidbg-cli.exe" "$stage\"
          Copy-Item LICENSE, README.md, README_EN.md "$stage\"
          Compress-Archive -Path "$stage" -DestinationPath "dist\$stage.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist\$stage.zip").Hash.ToLower()
          "$hash  $stage.zip" | Out-File -Encoding ascii -NoNewline "dist\$stage.zip.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  build-zygisk:
    name: Build (runidbg-zygisk-arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build clang libclang-dev zip

      - name: Install Rust toolchain (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          key: runidbg-zygisk-arm64

      - name: Build & package Zygisk module Zip
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-v0.5.0}"
          OUT_ZIP="dist/runidbg-zygisk-${VERSION}.zip"
          chmod +x scripts/build-zygisk.sh
          MODULE_VERSION="${VERSION}" ./scripts/build-zygisk.sh "${OUT_ZIP}"
          (cd dist && sha256sum "runidbg-zygisk-${VERSION}.zip" > "runidbg-zygisk-${VERSION}.zip.sha256")

      - name: Upload Zygisk module artifact
        uses: actions/upload-artifact@v4
        with:
          name: runidbg-zygisk-arm64
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: [build, build-zygisk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate combined SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          cat *.sha256 > SHA256SUMS.txt
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
