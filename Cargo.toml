[package]
name = "runidbg-arm64-emu-tracer"
version = "0.4.6"
edition = "2021"
authors = ["Ivory"]
license = "MIT"
repository = "https://github.com/tiwe0/runidbg"
keywords = ["android", "arm64", "emulator", "unicorn", "reverse-engineering"]
categories = ["emulators", "development-tools::debugging"]
description = "Lightweight high-performance Android ARM64 .so emulator & binary tracer in pure Rust"

[features]
# 默认编译全部核心特性与当前平台可用的执行后端：
# - Linux 默认编译: unicorn, dynarmic, kvm（hypervisor 仅在 macOS 编译）
# - macOS 默认编译: unicorn, dynarmic, hypervisor（kvm 仅在 Linux 编译）
# - `--no-default-features`: 仅保留 Unicorn 最小核心（Trace / GDB 仅支持 Unicorn）
default = ["js", "rpc", "mcp", "apk", "ui", "dynarmic", "kvm", "hypervisor"]
js = ["dep:rquickjs"]
rpc = ["js", "dep:serde_json", "dep:tokio", "dep:axum", "dep:async-channel"]
mcp = ["js", "dep:serde_json"]
apk = ["dep:zip"]
ui = ["rpc"]
dynarmic = ["dep:dynarmic"]
kvm = []
hypervisor = []

[dependencies]
unicorn-engine = "2.1"
goblin = "0.10"
bad64 = "0.13"
memmap2 = "0.9"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rquickjs = { version = "0.9", optional = true }
serde_json = { version = "1.0", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"], optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"], optional = true }
async-channel = { version = "2", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
dynarmic = { version = "0.1.3", optional = true }

[profile.dev.package.dynarmic]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
